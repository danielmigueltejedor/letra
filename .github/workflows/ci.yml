name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# reusable gate workflow in getnodalia/foundation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: getnodalia/foundation/.github/workflows/rust-gate.yml@16528aa5fba5abff2971c29ca9c4765cb15d1392 # foundation main
    with:
      # Same craft-fonts commit as release.yml.
      fonts-repository: getnodalia/foundation
      i18n-repository: getnodalia/foundation
      fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
        libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers

  # Every git dependency in Cargo.lock comes from getnodalia or nodalia-design.
  git-sources:
    name: git-sources
    uses: getnodalia/foundation/.github/workflows/git-sources.yml@16528aa5fba5abff2971c29ca9c4765cb15d1392 # foundation main

