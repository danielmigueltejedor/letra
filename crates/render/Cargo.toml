[package]
name = "letra-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Letra rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
letra-geom = { workspace = true, features = ["image"] }
letra-doc = { workspace = true }
letra-fonts = { workspace = true }
letra-layout = { workspace = true }
letra-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
